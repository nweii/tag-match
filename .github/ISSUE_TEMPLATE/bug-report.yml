# Collects actionable bug reports without requesting secrets or private notes.
name: Bug report
description: Report reproducible Tag Match behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tag Match version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [TypeSafe, OpenRouter, No network request]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal non-sensitive example. Never include API keys or private note contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
